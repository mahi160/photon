name: Release

# semantic-release computes the version from conventional commits and tags/
# releases (as a draft) on every push to prod — normally a PR merge. The
# platform builds below only run once a release actually happens, and
# undrafts it only once macOS's build succeeds (never publish a release
# missing the one platform that's actually verified). build-windows/
# build-linux both keep `continue-on-error: true` -- not because their
# builds are unverified (Windows has now been watched playing video on
# real hardware, see that job's comment) but because `needs` in GitHub
# Actions requires a listed job to *succeed* by default, and dropping the
# flag would let a Windows/Linux build failure block publish-release from
# ever running, taking the working macOS release down with it. The flag
# doesn't hide a failure -- that job's own run still shows red -- it only
# stops it from cascading. See each job's own comment for what's still
# unverified.
#
# .releaserc.json marks `prod` as a prerelease channel ("pre") -- versions
# come out as `2.0.0-pre.1`, `2.0.0-pre.2`, ... and the GitHub release is
# flagged as a pre-release, on top of (not instead of) the draft-until-
# macOS-succeeds gating above. `main` is also listed in `branches` there,
# unused for actual publishing (this workflow only ever triggers on `prod`)
# -- semantic-release's own validation requires at least one plain,
# non-prerelease release branch to *exist* alongside any prerelease branch
# (confirmed the hard way: a single fully-prerelease branch config fails
# with ERELEASEBRANCHES, "a minimum of 1 ... release branches are required"),
# `main` is just there to satisfy that. Reflects where this actually stands:
# v2 (the Electron -> Tauri replatform) is verified end-to-end on macOS only;
# Windows has a real WGL render surface (mpv/windows) watched playing video on
# real hardware, and Linux composites mpv into a GtkGLArea under the webview
# (mpv/linux, ADR-0010) and has been run on a live Wayland session -- but
# neither has shipped in an actual release yet, and Linux hardware decode is
# still unproven. Drop the `prerelease` flag once a Windows/Linux release has
# actually been run and watched playing video on real hardware, not just
# compiled in CI.
on:
  push:
    branches: [prod]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      tag: v${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ad-hoc signed (AGENTS.md's Gatekeeper note) via Tauri's own bundler +
  # updater signing (TAURI_SIGNING_PRIVATE_KEY secrets, not an Apple
  # Developer cert -- that part is unchanged/still not done, see AGENTS.md).
  # The one platform actually verified end-to-end -- gates `publish-release`
  # alone (see its `needs`).
  build-macos:
    needs: [release]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    runs-on: macos-latest # arm64 -- native only, no --target cross-build (see comment above)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      # Needed twice over: build.rs links against it, and
      # scripts/bundle-macos-dylibs.sh then copies this exact Cellar tree into
      # Photon.app so the shipped .dmg needs no mpv of its own (ADR-0011).
      - run: brew install mpv
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release.outputs.tag }}
          releaseDraft: true
          # `.app` (what the updater artifact is packed from) + the `.dmg` users download.
          args: --bundles app,dmg

  # ticket #11: Windows build -- wired up per request. A release built by
  # this job has been watched playing video on real Windows hardware, so
  # the compile/link-only caveat is gone -- `continue-on-error: true`
  # stays anyway, purely so a future Windows build failure still can't
  # block publish-release/the macOS release (see top-of-file comment), not
  # because Windows itself is still unverified.
  #
  # Ships the GPL libmpv build, like macOS -- ADR-0004's LGPL vendoring is
  # superseded by ADR-0011 (source stays MIT, this download is GPLv2+).
  # Bigger problem here: Windows has no pkg-config/vcpkg story for
  # libmpv at all -- a vcpkg port was proposed and closed unmerged
  # (microsoft/vcpkg#40587: "libmpv is very hard to build on windows with
  # msvc or with msys2 gcc"). So: download shinchiro/mpv-winbuild-cmake's
  # prebuilt nightly dev package (GPL build, ships a MinGW `.dll.a`, not an
  # MSVC `.lib`), then generate an MSVC-compatible import lib the way mpv's
  # own docs describe for exactly this (DOCS/compile-windows.md > "Linking
  # libmpv with MSVC Programs"): `gendef` the dll's exports into a `.def`,
  # then MSVC's `lib.exe /def:...`. build.rs picks up the result via
  # MPV_LIB_DIR. `mpv/windows/` has a real WGL render surface (issue #27),
  # confirmed rendering video on real Windows hardware.
  build-windows:
    needs: [release]
    if: needs.release.outputs.published == 'true'
    continue-on-error: true
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Download libmpv dev package (shinchiro/mpv-winbuild-cmake nightly, GPL build)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -o"mpv-dev" -y
      - name: Get gendef (mingw-w64-tools, via the runner's pre-installed MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-tools-git
          release: false
      - name: gendef libmpv-2.dll -> libmpv-2.def
        shell: msys2 {0}
        run: gendef mpv-dev/libmpv-2.dll
      - uses: ilammy/msvc-dev-cmd@v1
      - name: lib.exe /def -> mpv.lib (MSVC import lib)
        shell: pwsh
        run: lib /def:libmpv-2.def /name:libmpv-2.dll /out:mpv-dev/mpv.lib /machine:x64
      # No dll-staging step here on purpose: build.rs copies libmpv-2.dll out
      # of MPV_LIB_DIR itself, because tauri_build::build() validates the
      # bundle resource path at compile time and would fail before any CI step
      # could place it. tauri.windows.conf.json then has NSIS install it next
      # to photon.exe, which is the first place Windows looks for a dll.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MPV_LIB_DIR: ${{ github.workspace }}\mpv-dev
        with:
          tagName: ${{ needs.release.outputs.tag }}
          releaseDraft: true
          # NSIS only: it produces the `.exe` installer users actually want, and
          # it's what the updater artifact is built from. MSI is deliberately not
          # built -- a WiX hiccup would fail the whole job and take the `.exe`
          # down with it, for a second installer format nobody asked for.
          args: --bundles nsis

  # ticket #11: Linux build -- far lower-risk than Windows: Ubuntu ships a
  # real `libmpv-dev` package with a working .pc file, so build.rs's
  # existing pkg-config probe (same code path as macOS's brew mpv) just
  # works, no Linux-specific build.rs branch needed. One job covers *both*
  # X11 and Wayland: `mpv/linux/` renders into a GtkGLArea composited under
  # the webview (ADR-0010), so GTK picks the display server and GL flavour
  # at runtime from the same binary, same as any GTK app -- the old
  # X11-child-window/wl_subsurface split (and its GDK_BACKEND pinning) is
  # gone. Run on a live Wayland session end to end (window, GL context,
  # mpv render, geometry, logs); hardware decode is the piece still
  # unverified -- see ADR-0010's smoke-test checklist.
  build-linux:
    # Ships `.deb` + `.rpm` only (bundle.targets in tauri.conf.json): Tauri's
    # AppImage bundler copies libva* into the AppDir, where it then
    # version-mismatches the host's VAAPI driver and silently kills hardware
    # decode, and it offers no way to exclude a library. Consequence: no in-app
    # auto-update on Linux (Tauri's updater only supports AppImage there), so
    # Linux updates come from the distro package. The updater signing env below
    # is still required -- the bundler asks for it whenever
    # createUpdaterArtifacts is on, even with nothing updatable to sign.
    # Both platform builds are verified to the level AGENTS.md states; hardware
    # decode on Linux is still unproven (see ADR-0010's smoke-test checklist).
    needs: [release]
    if: needs.release.outputs.published == 'true'
    continue-on-error: true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release.outputs.tag }}
          releaseDraft: true
          # deb + rpm, no AppImage (see this job's comment). Both are pure-Rust
          # bundlers in Tauri, so no extra system tooling beyond the apt line above.
          args: --bundles deb,rpm

  publish-release:
    # build-windows/build-linux are `continue-on-error: true` above, so
    # listing them here only waits for them to finish (success or failure),
    # it never makes their outcome block this job -- lets whichever one
    # *does* succeed upload its artifacts (tauri-action's own behavior)
    # before this undrafts the release, without either being able to hold
    # the working macOS release back (Windows verified now, see its job's
    # comment, but keeps the flag for that non-blocking guarantee, not
    # because it's still unverified).
    needs: [release, build-macos, build-windows, build-linux]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --repo "${{ github.repository }}" --draft=false
